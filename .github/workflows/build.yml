name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk RetroPop.apk

      # Téléchargeable depuis l'onglet "Actions" du dépôt
      - uses: actions/upload-artifact@v4
        with:
          name: RetroPop-apk
          path: RetroPop.apk

      # Pour un tag v0.1.0 etc. : publie une release avec un lien direct vers l'APK
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RetroPop.apk
