<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RetroPop · Envoyer des jeux</title>
<style>
  :root { --bg:#0D0E16; --raised:#171926; --card:#1E2132; --text:#F2F1EC; --muted:#9A9DB2; --accent:#FFB000; --nes:#E5533D; --snes:#8C7BEA; --err:#FF6B6B; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:28px 16px 48px; }
  h1 { font-size:28px; margin:0 0 4px; letter-spacing:-0.02em; }
  h1 span { color:var(--accent); }
  .lede { color:var(--muted); margin:0 0 24px; }
  .drop { display:block; border:2px dashed #3A3E58; border-radius:16px; padding:32px 16px; text-align:center; background:var(--raised); cursor:pointer; transition:border-color .15s, background .15s; }
  .drop.over, .drop:hover { border-color:var(--accent); background:#1C1E2D; }
  .drop strong { display:block; font-size:18px; margin-bottom:6px; }
  .drop small { color:var(--muted); }
  input[type=file] { display:none; }
  .queue { list-style:none; padding:0; margin:16px 0 0; }
  .queue li { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid #23263A; font-size:14px; }
  .queue .st { color:var(--muted); white-space:nowrap; }
  .queue .ok { color:#7BD88F; } .queue .ko { color:var(--err); }
  h2 { font-size:18px; margin:36px 0 12px; display:flex; justify-content:space-between; align-items:baseline; }
  h2 small { color:var(--muted); font-weight:400; font-size:14px; }
  .games { list-style:none; padding:0; margin:0; display:grid; gap:8px; }
  .games li { display:flex; align-items:center; gap:12px; background:var(--card); border-radius:12px; padding:10px 12px; }
  .tag { font-size:11px; font-weight:700; letter-spacing:.06em; padding:3px 7px; border-radius:6px; color:#0D0E16; }
  .tag.NES { background:var(--nes); } .tag.SNES { background:var(--snes); }
  .games .t { flex:1; min-width:0; }
  .games .t b { display:block; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .games .t small { color:var(--muted); font-size:12px; }
  button.del { background:none; border:1px solid #3A3E58; color:var(--muted); border-radius:8px; padding:6px 10px; font:inherit; font-size:13px; cursor:pointer; }
  button.del:hover { border-color:var(--err); color:var(--err); }
  .empty { color:var(--muted); font-size:14px; }
  .note { margin-top:32px; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>Retro<span>Pop</span></h1>
  <p class="lede">Envoie tes jeux vers la box. Ils apparaissent tout de suite sur la télé.</p>

  <label class="drop" id="drop">
    <strong>Choisir des fichiers</strong>
    <small>ou les glisser ici · .nes · .sfc · .smc · .zip</small>
    <input type="file" id="files" multiple accept=".nes,.unf,.unif,.sfc,.smc,.fig,.swc,.zip">
  </label>
  <ul class="queue" id="queue"></ul>

  <h2>Sur la box <small id="count"></small></h2>
  <ul class="games" id="games"></ul>

  <p class="note">Utilise uniquement des sauvegardes de tes propres cartouches ou des jeux libres (homebrews).</p>
</main>
<script>
const $ = s => document.querySelector(s);
const fmt = n => n > 1048576 ? (n/1048576).toFixed(1) + ' Mo' : Math.max(1, Math.round(n/1024)) + ' Ko';

async function refresh() {
  const games = await (await fetch('/games')).json();
  $('#count').textContent = games.length + (games.length > 1 ? ' jeux' : ' jeu');
  const ul = $('#games'); ul.innerHTML = '';
  if (!games.length) { ul.innerHTML = '<li class="empty">Aucun jeu pour l’instant.</li>'; return; }
  for (const g of games) {
    const li = document.createElement('li');
    li.innerHTML = `<span class="tag ${g.system}">${g.system}</span><span class="t"><b></b><small></small></span><button class="del">Supprimer</button>`;
    li.querySelector('b').textContent = g.title;
    li.querySelector('small').textContent = g.file + ' · ' + fmt(g.size);
    li.querySelector('button').onclick = async () => {
      if (!confirm('Supprimer « ' + g.title + ' » et ses sauvegardes ?')) return;
      await fetch('/delete?name=' + encodeURIComponent(g.file), { method: 'POST' });
      refresh();
    };
    ul.appendChild(li);
  }
}

async function send(files) {
  for (const f of files) {
    const li = document.createElement('li');
    li.innerHTML = '<span></span><span class="st">envoi…</span>';
    li.firstChild.textContent = f.name;
    $('#queue').prepend(li);
    const st = li.querySelector('.st');
    try {
      const r = await fetch('/upload?name=' + encodeURIComponent(f.name), { method: 'POST', body: f });
      const j = await r.json();
      if (j.ok) { st.textContent = 'ajouté'; st.className = 'st ok'; }
      else { st.textContent = j.error || 'refusé'; st.className = 'st ko'; }
    } catch (e) { st.textContent = 'échec réseau'; st.className = 'st ko'; }
  }
  refresh();
}

$('#files').onchange = e => { send([...e.target.files]); e.target.value = ''; };
const drop = $('#drop');
['dragenter','dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => send([...e.dataTransfer.files]));
refresh();
</script>
</body>
</html>
